name: Selenoid Tests Workflow

on:
  push:
    branches:
      - develop

jobs:
  run-selenoid-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull chrome image for Selenoid
        run: docker pull selenoid/chrome:128.0

      - name: Run tests
        run: docker compose up --build --exit-code-from test